# ============================================
# ADD THESE ROUTES TO YOUR EXISTING API GATEWAY
# application.properties
# ============================================

spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ---- Existing routes ----
# patient-service
spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=lb://patient-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/patients/**

# appointment-service
spring.cloud.gateway.routes[1].id=appointment-service
spring.cloud.gateway.routes[1].uri=lb://appointment-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/appointments/**

# ---- NEW: Security routes ----
# jwt-auth-service
spring.cloud.gateway.routes[2].id=jwt-auth-service
spring.cloud.gateway.routes[2].uri=lb://jwt-auth-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/register,/auth/login,/auth/validate,/auth/test

# oauth2-auth-service
spring.cloud.gateway.routes[3].id=oauth2-auth-service
spring.cloud.gateway.routes[3].uri=lb://oauth2-auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/oauth2/**,/auth/user,/auth/users

# ---- JWT Validation ----
# JWT Secret (same as jwt-auth-service)
